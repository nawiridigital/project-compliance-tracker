<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXCO Reporting Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-body: #0b1120; 
            --bg-card: #131e35;
            --bg-card-hover: #1a2946;
            --bg-modal: #131e35;
            --border-color: #263b5e;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --accent-orange: #f97316;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            
            --status-pending-bg: #1e293b;
            --status-pending-text: #94a3b8;
            --status-progress-bg: #422006;
            --status-progress-text: #fbbf24;
            --status-completed-bg: #064e3b;
            --status-completed-text: #34d399;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            padding: 40px 24px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        /* --- Executive Header --- */
        .executive-header {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 30px auto;
            text-align: left;
        }

        .header-info h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.2;
        }

        .header-info p {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-info p::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-green);
        }

        /* --- Master List (At a Glance List) --- */
        .master-list-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 40px auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .master-section-header {
            font-size: 18px;
            font-weight: 700;
            padding: 16px 24px;
            color: white;
        }

        .master-section-header.sec1 { background-color: var(--accent-orange); }
        .master-section-header.sec2 { background-color: #4ade80; }

        .master-column {
            padding: 24px;
        }

        .master-column:first-child {
            border-right: 2px solid var(--border-color);
        }

        .master-project-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px 20px;
        }

        .master-column.sec2-list .master-project-list {
            grid-template-columns: 1fr;
        }

        .list-item {
            font-size: 14px;
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.4;
        }

        .list-item:hover {
            background: rgba(59, 130, 246, 0.15);
            transform: translateX(4px);
        }
        
        .list-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            margin-top: 6px;
        }

        /* --- KPI Dashboard Layout --- */
        .kpi-layout {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 40px auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
            align-items: stretch;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: transparent;
            transition: var(--transition);
        }

        .kpi-card:hover { background: var(--bg-card-hover); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .kpi-card.active { background: var(--bg-card-hover); border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .kpi-card.active::before { background: var(--accent-blue); }

        .kpi-card .number {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 12px;
            color: #fff;
        }

        .kpi-card .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .kpi-card.pending .number { color: #94a3b8; }
        .kpi-card.progress .number { color: #fbbf24; }
        .kpi-card.completed .number { color: #34d399; }

        /* --- Project Grid --- */
        .section-title {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 20px auto;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--border-color);
        }

        .dashboard-grid {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* --- Project Cards --- */
        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .task-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            flex-grow: 1;
            padding-right: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .badge-pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
        .badge-progress { background: var(--status-progress-bg); color: var(--status-progress-text); }
        .badge-completed { background: var(--status-completed-bg); color: var(--status-completed-text); }
        .badge-hold { background: #450a0a; color: #f87171; }

        .card-details {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-details strong { color: var(--text-muted); font-weight: 600; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .owner-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .followup-count {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* --- Footer Action Buttons --- */
        .footer-actions-container {
            max-width: 1400px;
            width: 100%;
            margin: 20px auto 0 auto;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .action-btn.primary { background: var(--accent-blue); border-color: var(--accent-blue); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .action-btn.primary:hover { background: #2563eb; box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }
        .action-btn.clear-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        .action-btn.clear-btn:hover { background: rgba(239, 68, 68, 0.2); }

        /* --- Modal / Popup System --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-modal);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.2s ease-out;
        }

        @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 20px; font-weight: 800; color: #fff; }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
        }
        .close-btn:hover { color: #fff; }

        .modal-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2);
        }

        .modal-tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition);
        }

        .modal-tab:hover { color: var(--text-primary); }
        .modal-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); background: rgba(59, 130, 246, 0.05); }

        .modal-body { padding: 24px; overflow-y: auto; flex-grow: 1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-grid .full-width { grid-column: span 2; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input, .input-group select {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            width: 100%;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }

        .modal-actions {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: var(--transition);
        }
        .btn-primary { background: var(--accent-blue); color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: var(--accent-green); color: #fff; }
        .btn-success:hover { background: #059669; }

        /* Updated Log Form */
        .log-form {
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            margin-bottom: 24px; 
            background: rgba(0,0,0,0.2);
            padding: 16px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color);
        }
        
        .log-form-top {
            display: flex;
            gap: 10px;
        }

        .log-form select { 
            width: 200px; 
            flex-shrink: 0; 
            background-color: var(--bg-body); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            padding: 12px; 
            color: var(--text-primary); 
            outline: none;
        }

        .auto-expand-textarea {
            width: 100%;
            background-color: var(--bg-body); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            padding: 12px; 
            color: var(--text-primary); 
            outline: none;
            resize: none; 
            overflow: hidden; 
            min-height: 45px;
            max-height: 200px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .auto-expand-textarea:focus {
            border-color: var(--accent-blue);
        }

        .log-form-bottom {
            display: flex;
            justify-content: flex-end;
        }

        .followup-list { display: flex; flex-direction: column; gap: 12px; }
        .followup-item {
            background: rgba(255,255,255,0.02); border-left: 4px solid var(--border-color);
            padding: 16px; border-radius: 6px; position: relative;
        }
        .followup-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .category-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
        
        .badge-physical-visit { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-calling { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-virtual-meeting { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
        .badge-email { background: rgba(249, 115, 22, 0.2); color: #f97316; }
        .badge-other { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }

        .followup-date { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .followup-text { font-size: 14px; color: var(--text-primary); line-height: 1.5; white-space: pre-wrap; }

        @media (max-width: 1100px) {
            .kpi-layout { grid-template-columns: 1fr 1fr; }
            .master-list-container { grid-template-columns: 1fr; }
            .master-column:first-child { border-right: none; border-bottom: 2px solid var(--border-color); }
        }
        @media (max-width: 600px) {
            .kpi-layout { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .form-grid .full-width { grid-column: span 1; }
            .log-form-top { flex-direction: column; }
            .log-form select { width: 100%; }
            .footer-actions-container { flex-direction: column; }
            .action-btn { width: 100%; justify-content: center; }
        }
    </style>
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <header class="executive-header">
        <div class="header-info">
            <h1>EXCO Reporting Dashboard</h1>
            <p>Executive Reporting &bull; Live Updates &bull; Matched with PDF</p>
        </div>
    </header>

    <!-- COMPLETE ITEM LIST JUST AFTER HEADER -->
    <div class="master-list-container">
        <!-- Section 1 Column -->
        <div class="master-column">
            <div class="master-section-header sec1">Section 1</div>
            <div class="master-project-list" id="master-list-1">
                <!-- Populated by JS -->
            </div>
        </div>
        
        <!-- Section 2 Column -->
        <div class="master-column sec2-list">
            <div class="master-section-header sec2">Section 2</div>
            <div class="master-section-title" style="color: var(--accent-blue); margin: 10px 0 15px 10px; font-size: 16px; font-weight: 700;">Tenders</div>
            <div class="master-project-list" id="master-list-2">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <!-- KPI Filter Layout -->
    <div class="kpi-layout" id="kpi-dashboard">
        <div class="kpi-card total active" id="filter-All" onclick="setFilter('All')">
            <div class="number" id="stat-total">29</div>
            <div class="label">Total Projects</div>
        </div>
        <div class="kpi-card pending" id="filter-Pending" onclick="setFilter('Pending')">
            <div class="number" id="stat-pending">0</div>
            <div class="label">Pending</div>
        </div>
        <div class="kpi-card progress" id="filter-InProgress" onclick="setFilter('In Progress')">
            <div class="number" id="stat-progress">0</div>
            <div class="label">In Progress</div>
        </div>
        <div class="kpi-card completed" id="filter-Completed" onclick="setFilter('Completed')">
            <div class="number" id="stat-completed">0</div>
            <div class="label">Completed</div>
        </div>
    </div>

    <!-- Filtered Project Display -->
    <div class="section-title" id="view-title">Showing: All Projects</div>
    <main class="dashboard-grid" id="project-grid">
        <!-- Cards injected via JS -->
    </main>

    <!-- FOOTER ACTION BUTTONS -->
    <div class="footer-actions-container">
        <button class="action-btn primary" onclick="exportPDF()">📄 Export PDF Analysis</button>
        <button class="action-btn" onclick="exportData()">📥 Export Data (JSON)</button>
        <button class="action-btn" onclick="document.getElementById('importFile').click()">📤 Import Data</button>
        <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        <button class="action-btn clear-btn" onclick="clearAllData()">Reset Data</button>
    </div>

    <!-- Modal / Popup System -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Project Title</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-tabs">
                <div class="modal-tab active" onclick="switchTab('details')">📋 Details & Edit</div>
                <div class="modal-tab" onclick="switchTab('followup')">📝 Follow-up Log</div>
            </div>

            <div class="modal-body">
                <!-- Tab 1: Details -->
                <div class="tab-content active" id="tab-details">
                    <div class="form-grid">
                        <div class="input-group full-width">
                            <label>Person Responsible</label>
                            <input type="text" id="edit-owner">
                        </div>
                        <div class="input-group full-width">
                            <label>Institution / Organization</label>
                            <input type="text" id="edit-institution" placeholder="Enter institution name">
                        </div>
                        <div class="input-group">
                            <label>Primary Contact Person</label>
                            <input type="text" id="edit-contactPerson" placeholder="Name">
                        </div>
                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" id="edit-phone" placeholder="+254...">
                        </div>
                        <div class="input-group">
                            <label>Secondary Contact</label>
                            <input type="text" id="edit-secondaryContact" placeholder="Name">
                        </div>
                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" id="edit-email" placeholder="name@institution.com">
                        </div>
                        <div class="input-group full-width">
                            <label>Current Status</label>
                            <select id="edit-status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                                <option value="On Hold">On Hold</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-actions" style="border:none; padding: 20px 0 0 0;">
                        <button class="btn btn-success" onclick="saveDetails()">💾 Save Changes</button>
                    </div>
                </div>

                <!-- Tab 2: Follow-ups -->
                <div class="tab-content" id="tab-followup">
                    <div class="log-form">
                        <div class="log-form-top">
                            <select id="log-category">
                                <option value="Physical Visit">Physical Visit</option>
                                <option value="Calling">Calling</option>
                                <option value="Virtual Meeting">Virtual Meeting</option>
                                <option value="Email">Email</option>
                                <option value="Other">Other</option>
                            </select>
                            <textarea id="log-text" class="auto-expand-textarea" rows="1" placeholder="Enter follow-up details..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                        </div>
                        <div class="log-form-bottom">
                            <button class="btn btn-primary" onclick="addFollowup()">+ Add Log</button>
                        </div>
                    </div>
                    <div class="followup-list" id="modal-followup-list">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Data Structure perfectly matching the image + PDF ---
        const baseData = {
            section1: [
                { id: 's1-1', owner: 'Irene', title: '1. DAMAC' },
                { id: 's1-2', owner: 'Elsie', title: '2. Avocadoes' },
                { id: 's1-3', owner: 'Richard', title: '3. MSEA' },
                { id: 's1-4', owner: 'Elsie', title: '4. Nyandarua Roads' }, // PDF Name

        // --- Render Master List at the top ---

        // --- Initialize / Update UI ---
        function renderDashboard() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';
            
            let counts = { 'All': allTasks.length, 'Pending': 0, 'In Progress': 0, 'Completed': 0, 'On Hold': 0 };

            allTasks.forEach(item => {
                const data = userData[item.id] || {};
                const status = data.status || 'Pending';
                
                if (counts[status] !== undefined) counts[status]++;

                if (currentFilter !== 'All' && status !== currentFilter) return;

                const card = document.createElement('div');
                card.className = 'task-card';
                card.onclick = () => openModal(item.id);

                const statusStyle = statusConfig[status];

                card.innerHTML = `
                    <div class="card-top">
                        <div class="card-title">${item.title}</div>
                        <span class="status-badge ${statusStyle.badgeClass}">${status}</span>
                    </div>
                    <div class="card-details">
                        <div><strong>Institution:</strong> ${data.institution || 'Not Set'}</div>
                        <div><strong>Contact:</strong> ${data.contactPerson || 'Not Set'}</div>
                    </div>
                    <div class="card-footer">
                        <span class="owner-tag">👤 ${item.owner}</span>
                        <span class="followup-count">${(data.followups || []).length} Logs</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('stat-total').innerText = counts['All'];
            document.getElementById('stat-pending').innerText = counts['Pending'];
            document.getElementById('stat-progress').innerText = counts['In Progress'];
            document.getElementById('stat-completed').innerText = counts['Completed'];

            renderMasterList();

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.kpi-card').forEach(el => el.classList.remove('active'));
            let id = 'filter-All';
            if (filter === 'Pending') id = 'filter-Pending';
            if (filter === 'In Progress') id = 'filter-InProgress';
            if (filter === 'Completed') id = 'filter-Completed';
            document.getElementById(id).classList.add('active');

            document.getElementById('view-title').innerText = `Showing: ${filter === 'All' ? 'All Projects' : filter + ' Projects'}`;
            renderDashboard();
        }

        // --- Modal Functions ---
        function openModal(taskId) {
            currentTaskId = taskId;
            const item = allTasks.find(t => t.id === taskId);
            const data = userData[taskId] || {}; 

            document.getElementById('modal-title').innerText = item.title;
            
            document.getElementById('edit-owner').value = item.owner;
            document.getElementById('edit-institution').value = data.institution || '';
            document.getElementById('edit-contactPerson').value = data.contactPerson || '';
            document.getElementById('edit-phone').value = data.phone || '';
            document.getElementById('edit-secondaryContact').value = data.secondaryContact || '';
            document.getElementById('edit-email').value = data.email || '';
            document.getElementById('edit-status').value = data.status || 'Pending';

            const logTextarea = document.getElementById('log-text');
            logTextarea.value = '';
            logTextarea.style.height = '45px'; 

            renderFollowups(); 
            switchTab('details');
            document.getElementById('taskModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            currentTaskId = null;
            renderDashboard();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        function saveDetails() {
            if (!currentTaskId) return;
            if (!userData[currentTaskId]) userData[currentTaskId] = { followups: [] };

            userData[currentTaskId].institution = document.getElementById('edit-institution').value;
            userData[currentTaskId].contactPerson = document.getElementById('edit-contactPerson').value;
            userData[currentTaskId].phone = document.getElementById('edit-phone').value;
            userData[currentTaskId].secondaryContact = document.getElementById('edit-secondaryContact').value;
            userData[currentTaskId].email = document.getElementById('edit-email').value;
            userData[currentTaskId].status = document.getElementById('edit-status').value;

            const item = allTasks.find(t => t.id === currentTaskId);
            item.owner = document.getElementById('edit-owner').value;

            saveData();
            alert('Details saved successfully!');
            renderDashboard();
        }

        // --- Followup Functions ---
        function addFollowup() {
            const category = document.getElementById('log-category').value;
            const textarea = document.getElementById('log-text');
            const text = textarea.value.trim();

            if (!text) return alert('Please enter follow-up details.');

            if (!userData[currentTaskId]) userData[currentTaskId] = { followups: [] };
            if (!userData[currentTaskId].followups) userData[currentTaskId].followups = [];

            userData[currentTaskId].followups.push({
                category: category,
                text: text,
                date: new Date().toLocaleString()
            });

            textarea.value = '';
            textarea.style.height = '45px'; 

            saveData();
            renderFollowups(); 
            renderDashboard();
        }

        function renderFollowups() {
            const list = document.getElementById('modal-followup-list');
            list.innerHTML = '';
            
            const data = userData[currentTaskId] || {};
            const followups = data.followups || [];

            if (followups.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">No follow-ups logged yet.</p>';
                return;
            }

            [...followups].reverse().forEach((log) => {
                let badgeClass = 'badge-other';
                if(log.category === 'Physical Visit') badgeClass = 'badge-physical-visit';
                if(log.category === 'Calling') badgeClass = 'badge-calling';
                if(log.category === 'Virtual Meeting') badgeClass = 'badge-virtual-meeting';
                if(log.category === 'Email') badgeClass = 'badge-email';

                const div = document.createElement('div');
                div.className = 'followup-item';
                div.innerHTML = `
                    <div class="followup-meta">
                        <span class="category-badge ${badgeClass}">${log.category}</span>
                        <span class="followup-date">${log.date}</span>
                    </div>
                    <div class="followup-text">${log.text}</div>
                `;
                list.appendChild(div);
            });
        }

        // --- Data Import / Export ---
        function exportData() {
            const dataStr = JSON.stringify(userData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `EXCO_Data_Backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    userData = imported;
                    saveData();
                    renderDashboard();
                    alert('Data imported successfully!');
                } catch (err) {
                    alert('Error parsing JSON file. Please ensure it is a valid backup.');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        function clearAllData() {
            if(confirm("Are you sure you want to reset all data? This will delete all follow-up logs and custom fields.")) {
                localStorage.removeItem(STORAGE_KEY);
                userData = JSON.parse(JSON.stringify(preloadedData));
                saveData();
                renderDashboard();
            }
        }

        // --- PDF Export Analysis ---
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

            doc.setFillColor(19, 30, 53); 
            doc.rect(0, 0, pageWidth, 100, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("EXCO Reporting Dashboard", 40, 45);
            
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(148, 163, 184);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 40, 65);

            let counts = { 'Pending': 0, 'In Progress': 0, 'Completed': 0, 'On Hold': 0 };
            allTasks.forEach(item => {
                const status = userData[item.id] ? userData[item.id].status : 'Pending';
                if (counts[status] !== undefined) counts[status]++;
            });

            doc.setTextColor(11, 17, 32);
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("Status Summary", 40, 130);

            doc.autoTable({
                startY: 145,
                head: [['Total Projects', 'Pending', 'In Progress', 'Completed', 'On Hold']],
                body: [[
                    allTasks.length.toString(),
                    counts['Pending'].toString(),
                    counts['In Progress'].toString(),
                    counts['Completed'].toString(),
                    counts['On Hold'].toString()
                ]],
                theme: 'grid',
                headStyles: { fillColor: [59, 130, 246], textColor: 255, fontStyle: 'bold' },
                styles: { font: 'helvetica', fontSize: 11, halign: 'center' },
                columnStyles: {
                    0: { fontStyle: 'bold' },
                    1: { textColor: [100, 116, 139], fontStyle: 'bold' },
                    2: { textColor: [217, 119, 6], fontStyle: 'bold' },
                    3: { textColor: [16, 185, 129], fontStyle: 'bold' },
                    4: { textColor: [239, 68, 68], fontStyle: 'bold' }
                }
            });

            const currentY = doc.lastAutoTable.finalY + 30;
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("Detailed Project Breakdown", 40, currentY);

            const tableRows = allTasks.map(item => {
                const data = userData[item.id] || {}; 
                return [
                    item.title,
                    data.institution || '-',
                    item.owner,
                    data.status || 'Pending',
                    (data.followups || []).length
                ];
            });

            doc.autoTable({
                startY: currentY + 15,
                head: [['Project Name', 'Institution', 'Owner', 'Status', 'Logs']],
                body: tableRows,
                theme: 'striped',
                headStyles: { fillColor: [38, 59, 94], textColor: 255 },
                alternateRowStyles: { fillColor: [248, 250, 252] },
                styles: { font: 'helvetica', fontSize: 9, cellPadding: 6 },
                columnStyles: {
                    0: { cellWidth: 180 },
                    1: { cellWidth: 150 },
                    2: { cellWidth: 80 },
                    3: { cellWidth: 70, fontStyle: 'bold' },
                    4: { cellWidth: 40, halign: 'center' }
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && data.column.index === 3) {
                        const status = data.cell.raw;
                        if (status === 'Pending') data.cell.styles.textColor = [100, 116, 139];
                        if (status === 'In Progress') data.cell.styles.textColor = [217, 119, 6];
                        if (status === 'Completed') data.cell.styles.textColor = [16, 185, 129];
                        if (status === 'On Hold') data.cell.styles.textColor = [239, 68, 68];
                    }
                }
            });

            let hasLogs = false;
            allTasks.forEach(item => {
                const data = userData[item.id] || {};
                if (data.followups && data.followups.length > 0) hasLogs = true;
            });

            if (hasLogs) {
                doc.addPage();
                doc.setTextColor(11, 17, 32);
                doc.setFontSize(14);
                doc.setFont("helvetica", "bold");
                doc.text("Detailed Follow-up Activity Log", 40, 50);

                let logRows = [];
                allTasks.forEach(item => {
                    const data = userData[item.id] || {}; 
                    if (data.followups && data.followups.length > 0) {
                        data.followups.forEach(log => {
                            logRows.push([
                                item.title,
                                log.date,
                                log.category,
                                log.text
                            ]);
                        });
                    }
                });

                doc.autoTable({
                    startY: 65,
                    head: [['Project', 'Date & Time', 'Type', 'Details']],
                    body: logRows,
                    theme: 'grid',
                    headStyles: { fillColor: [16, 185, 129], textColor: 255 },
                    styles: { font: 'helvetica', fontSize: 8, cellPadding: 5 },
                    columnStyles: {
                        0: { cellWidth: 100 },
                        1: { cellWidth: 90 },
                        2: { cellWidth: 70, fontStyle: 'bold' },
                        3: { cellWidth: 'auto' }
                    }
                });
            }

            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(148, 163, 184);
                doc.text(`Page ${i} of ${pageCount}`, pageWidth - 60, pageHeight - 20);
                doc.text("Confidential - Executive Reporting", 40, pageHeight - 20);
            }

            doc.save(`EXCO_Analysis_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        renderDashboard();
